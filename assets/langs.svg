<svg xmlns="http://www.w3.org/2000/svg" width="350" height="185" viewBox="0 0 350 185" fill="none" role="img" aria-label="Most used languages">
<style>
  .title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #0969da; }
  .label { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #1f2328; }
  .value { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #1f2328; }
  .muted { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #59636e; }
</style>
<rect width="350" height="185" rx="6" fill="#ffffff"/>
<text class="title" x="25" y="35">Most used languages</text>
<clipPath id="bar"><rect x="25" y="56" width="300" height="8" rx="4"/></clipPath>
<rect x="25" y="56" width="300" height="8" rx="4" fill="#eff2f5"/>
