<rect x="25.00" y="56" width="211.82" height="8" fill="#00ADD8"/>
<rect x="236.82" y="56" width="52.45" height="8" fill="#3572A5"/>
<rect x="289.27" y="56" width="13.33" height="8" fill="#f34b7d"/>
<rect x="302.60" y="56" width="10.23" height="8" fill="#555555"/>
<rect x="312.83" y="56" width="3.71" height="8" fill="#89e051"/>
<rect x="316.54" y="56" width="8.46" height="8" fill="#8b949e"/>
</g>
<circle cx="30" cy="93" r="5" fill="#00ADD8"/><text class="label" x="43" y="98">Go<tspan class="muted" dx="6">70.6%</tspan></text>
<circle cx="190" cy="93" r="5" fill="#3572A5"/><text class="label" x="203" y="98">Python<tspan class="muted" dx="6">17.5%</tspan></text>
