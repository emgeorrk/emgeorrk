<circle cx="190" cy="123" r="5" fill="#555555"/><text class="label" x="203" y="128">C<tspan class="muted" dx="6">3.4%</tspan></text>
<circle cx="30" cy="153" r="5" fill="#89e051"/><text class="label" x="43" y="158">Shell<tspan class="muted" dx="6">1.2%</tspan></text>
